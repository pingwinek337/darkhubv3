name: Build DarkHUD

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: darkhud-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
